<svg xmlns="http://www.w3.org/2000/svg" width="830" height="250" viewBox="0 0 830 250" role="img" aria-label="player-card" xmlns:c2pa="http://c2pa.org/manifest"><style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
.f{opacity:0;animation:fin .7s ease-out forwards}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.run{stroke-dasharray:170 830;animation:run 5s linear infinite}
@keyframes run{to{stroke-dashoffset:-1000}}
.scan{animation:scan 4.5s linear infinite}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(250px)}}
.sheen{animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-200px)}55%,100%{transform:translateX(900px)}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.float{animation:float 6s linear infinite}
@keyframes float{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-260px);opacity:0}}
.g1{animation:g1 3.2s steps(1) infinite}
@keyframes g1{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-5px,1px)}94%{transform:translate(4px,-1px)}}
.g2{animation:g2 3.2s steps(1) infinite}
@keyframes g2{0%,88%,100%{transform:translate(0,0)}91%{transform:translate(5px,-1px)}95%{transform:translate(-4px,1px)}}
