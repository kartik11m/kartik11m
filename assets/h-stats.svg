<svg xmlns="http://www.w3.org/2000/svg" width="830" height="56" viewBox="0 0 830 56" role="img" aria-label="h-stats" xmlns:c2pa="http://c2pa.org/manifest"><style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
.f{opacity:0;animation:fin .7s ease-out forwards}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.run{stroke-dasharray:170 830;animation:run 5s linear infinite}
@keyframes run{to{stroke-dashoffset:-1000}}
.scan{animation:scan 4.5s linear infinite}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(56px)}}
.sheen{animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-200px)}55%,100%{transform:translateX(900px)}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.float{animation:float 6s linear infinite}
@keyframes float{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-260px);opacity:0}}
.g1{animation:g1 3.2s steps(1) infinite}
@keyframes g1{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-5px,1px)}94%{transform:translate(4px,-1px)}}
.g2{animation:g2 3.2s steps(1) infinite}
@keyframes g2{0%,88%,100%{transform:translate(0,0)}91%{transform:translate(5px,-1px)}95%{transform:translate(-4px,1px)}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14141f"/><stop offset="1" stop-color="#0a0a12"/></linearGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcee0a" stop-opacity="0"/><stop offset=".5" stop-color="#fcee0a" stop-opacity=".12"/><stop offset="1" stop-color="#fcee0a" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect x="1" y="1" width="828" height="54" rx="14"/></clipPath>
</defs><rect x="0" y="0" width="830" height="56" rx="10" fill="url(#bg)" stroke="#262636"/><text x="16" y="37" font-size="28" fill="#fcee0a" font-weight="normal" text-anchor="start" letter-spacing="0">▌</text><text class="f" style="animation-delay:0s" x="42" y="37" font-size="22" fill="#e8e8f2" font-weight="bold" text-anchor="start" letter-spacing="3">PLAYER STATS</text><rect x="0" y="52" width="0" height="4" fill="#fcee0a" filter="url(#glow)"><animate attributeName="width" from="0" to="830" dur="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect><rect class="pulse" x="804" y="16" width="10" height="10" fill="#00f0ff"/><rect class="pulse" style="animation-delay:.5s" x="788" y="16" width="10" height="10" fill="#fcee0a"/><rect class="pulse" style="animation-delay:1s" x="772" y="16" width="10" height="10" fill="#ff2a6d"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>